<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092a3d"><title>Castaway Island — a living little world</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui;background:#092a3d;color:#fff3d9}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:22px;left:25px}h1{font-size:clamp(23px,4vw,37px);margin:0;letter-spacing:-.05em}header small{letter-spacing:.17em;text-transform:uppercase;color:#cae1e0}#card{position:absolute;right:20px;top:22px;text-align:right;max-width:240px}#card b{font-size:15px}#card p{color:#e8eff1;line-height:1.5}#sub{position:absolute;bottom:95px;left:10%;width:80%;text-align:center;font:italic 18px Georgia,serif;text-shadow:0 2px 9px #123}nav{pointer-events:auto;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:7px;border:1px solid #ffffff45;padding:8px;border-radius:18px;background:#08283ecb;backdrop-filter:blur(12px)}button{background:#ffffff20;border:1px solid #ffffff2a;color:inherit;padding:11px 13px;border-radius:12px;cursor:pointer;white-space:nowrap}button:hover,button:focus-visible{background:#ffffff42}button:focus-visible{outline:2px solid #fff}#sound{background:#e4c185;color:#172c39}#bar{position:absolute;bottom:0;left:0;height:3px;background:#efd39b;width:0}#help{position:absolute;bottom:25px;left:24px;font-size:12px;color:#dceae4}@media(max-width:750px){header{top:12px;left:12px}#card{top:75px;right:12px;max-width:175px;font-size:12px}#sub{bottom:80px;font-size:15px}nav{bottom:12px;gap:3px;padding:5px}button{padding:10px 8px;font-size:11px}#help{display:none}}
</style></head><body><div id="ui"><header><h1>Castaway Island</h1><small>A living little world</small></header><div id="card"><b id="name">A quiet day</b><p id="desc">The tide comes and goes.</p></div><div id="sub">There is always tomorrow.</div><div id="help">Drag to orbit · Pinch to zoom · Space to pause · → next scene</div><nav><button id="sound">Enable sound</button><button id="next">Next scene ↗</button><button id="pause">Pause</button><button id="night">Night</button><button id="reset">Reset view</button></nav><div id="bar"></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#94cfdf');scene.fog=new T.Fog('#94cfdf',26,95);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,180);camera.position.set(12,9,17);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=9;orbit.maxDistance=37;orbit.maxPolarAngle=1.48;orbit.target.set(0,1,0);
scene.add(new T.HemisphereLight('#e2f7ff','#77734c',2));const sun=new T.DirectionalLight('#fff1c9',3.1);sun.position.set(-7,12,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-14;sun.shadow.camera.right=14;sun.shadow.camera.top=14;sun.shadow.camera.bottom=-14;scene.add(sun);
const m=c=>new T.MeshStandardMaterial({color:c,roughness:1,flatShading:true}),sand=m('#efd49a'),wood=m('#805a3b'),bark=m('#967354'),leaf=m('#438551'),leaf2=m('#65a461'),skin=m('#d49d74'),hair=m('#53402e'),shirt=m('#eddfc0'),shorts=m('#987359'),white=m('#fff8e8');
function obj(g,mt,x=0,y=0,z=0,p=scene){const o=new T.Mesh(g,mt);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function ball(r,mt,x,y,z,p=scene){return obj(new T.IcosahedronGeometry(r,1),mt,x,y,z,p)}
function rod(a,b,r,mt,p=scene){const d=new T.Vector3(...b).sub(new T.Vector3(...a)),o=obj(new T.CylinderGeometry(r*.9,r,d.length(),7),mt,(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2,p);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());return o}
const lower=obj(new T.IcosahedronGeometry(3.9,2),sand,0,-.37,0);lower.scale.set(1.42,.21,.91);const upper=obj(new T.IcosahedronGeometry(3.7,2),m('#f5dda4'),0,-.15,0);upper.scale.set(1.42,.17,.92);
const seaMat=new T.MeshStandardMaterial({color:'#207fa7',roughness:.48,metalness:.08,flatShading:true});const seaGeo=new T.PlaneGeometry(180,180,60,60);seaGeo.rotateX(-Math.PI/2);const sea=obj(seaGeo,seaMat,0,-.62,0);sea.castShadow=false;const seaPos=seaGeo.attributes.position,base=seaPos.array.slice();
const foam=[];for(let i=0;i<3;i++){const o=obj(new T.TorusGeometry(4.4+i*.14,.026,5,110),new T.MeshBasicMaterial({color:'#dcf8e6',transparent:true,opacity:.28-i*.06}),0,-.45+i*.015,0);o.rotation.x=Math.PI/2;o.scale.set(1.32,.83,1);foam.push(o)}
const dock=new T.Group();dock.position.set(3.5,0,.85);scene.add(dock);for(let i=0;i<6;i++)obj(new T.BoxGeometry(.5,.15,1.25),i%2?wood:bark,i*.48-.4,-.06,0,dock);for(let x of [-.4,2])for(let z of [-.45,.45])rod([x,-.76,z],[x,0,z],.10,wood,dock);
const palm=new T.Group();palm.position.set(-2.1,0,-.7);scene.add(palm);let P=[];for(let i=0;i<=9;i++){let t=i/9;P.push([t*.7,t*4.8,Math.sin(t*Math.PI)*.18])}for(let i=0;i<9;i++)rod(P[i],P[i+1],.23-i*.015,i%2?bark:wood,palm);
const crown=new T.Group();crown.position.set(.7,4.8,0);palm.add(crown);for(let i=0;i<9;i++){const fr=new T.Group();fr.rotation.y=i*Math.PI*2/9;crown.add(fr);for(let j=0;j<7;j++){let t=(j+.5)/7;const l=obj(new T.ConeGeometry(.44*(1-t*.65),.92,3),i%2?leaf:leaf2,t*3.35,Math.sin(t*Math.PI)*.6-t*t*1.25,0,fr);l.rotation.z=Math.PI/2+t*.26;l.rotation.y=j%2?.12:-.12}}for(let i=0;i<3;i++)ball(.24,wood,.55+Math.cos(i*2)*.2,-.38,Math.sin(i*2)*.2,crown);
const bush=new T.Group();bush.position.set(1.8,.08,-1.2);scene.add(bush);for(let i=0;i<11;i++){let a=i*2.4;ball(.35+(i%3)*.05,i%2?leaf:leaf2,Math.cos(a)*.55,.17+(i%4)*.1,Math.sin(a)*.37,bush)}
const actor=new T.Group();actor.position.set(0,.10,.2);scene.add(actor);const torso=new T.Group();torso.position.y=1.15;actor.add(torso);obj(new T.CylinderGeometry(.29,.36,.8,8),shirt,0,0,0,torso);const head=new T.Group();head.position.y=.65;torso.add(head);ball(.30,skin,0,0,0,head);ball(.29,hair,0,.16,-.07,head);ball(.26,hair,0,-.18,.15,head);for(let s of [-1,1]){ball(.047,white,s*.13,.04,.282,head);ball(.023,m('#18261f'),s*.13,.04,.321,head);ball(.14,hair,s*.22,-.02,-.12,head)}const nose=obj(new T.ConeGeometry(.105,.18,6),skin,0,-.05,.31,head);nose.rotation.x=Math.PI/2;
obj(new T.CylinderGeometry(.36,.34,.32,8),shorts,0,.85,0,actor);const arms=[],legs=[];for(let s of [-1,1]){const a=new T.Group();a.position.set(s*.33,.3,0);torso.add(a);rod([0,0,0],[s*.12,-.55,.1],.11,skin,a);ball(.11,skin,s*.12,-.57,.1,a);arms.push(a);const l=new T.Group();l.position.set(s*.18,.78,0);actor.add(l);rod([0,0,0],[0,-.65,.02],.12,skin,l);obj(new T.BoxGeometry(.2,.12,.34),skin,0,-.69,.13,l);legs.push(l)}
const prop=new T.Group();scene.add(prop);const coconut=ball(.22,wood,.7,.23,.65,prop);const pole=rod([.9,.15,1.1],[1.4,2,1.1],.035,wood,prop);const float=ball(.08,white,1.7,-.45,1.1,prop);const raft=new T.Group();raft.position.set(1.6,.05,1.1);scene.add(raft);for(let i=0;i<4;i++){const log=obj(new T.CylinderGeometry(.16,.16,1.7,7),bark,i*.33-.5,0,0,raft);log.rotation.x=Math.PI/2}
const stories=[['A quiet day','He surveys his kingdom of sand.','idle','A kingdom of one.'],['Gone fishing','Patience is an admirable quality.','fish','The fish have other plans.'],['Coconut lunch','Lunch is more complicated than expected.','coconut','Lunch fights back.'],['Morning exercise','One lap is a considerable expedition.','run','Around the world in eight seconds.'],['A distant ship','He waves with unreasonable confidence.','wave','Perhaps they saw him.'],['A magnificent invention','The castaway works on a glorious plan.','build','Progress is relative.'],['The raft','Four logs and a limitless imagination.','raft','Nothing can possibly go wrong.'],['Rain dance','The weather does not cooperate.','dance','The clouds seem unimpressed.'],['Afternoon nap','There is time to dream.','sleep','He dreams of dry socks.'],['Departure','The greatest journey begins.','depart','It ends slightly sooner.'],['Something in the water','Perhaps swimming is a bad idea.','alarm','There are other options.'],['Still here','The tide brings another day.','idle','There is always tomorrow.']];
let index=0,seconds=0,total=0,paused=false,dark=false,ctx,master,noiseFilter,noiseGain;const duration=30,$=s=>document.querySelector(s);
function cue(freq=440){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.83,t+.22);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(master);o.start(t);o.stop(t+.26)}
function event(n){index=(n+stories.length)%stories.length;seconds=0;const [name,desc,kind,sub]=stories[index];$('#name').textContent=String(index+1).padStart(2,'0')+' · '+name;$('#desc').textContent=desc;$('#sub').textContent=sub;coconut.visible=kind==='coconut';pole.visible=float.visible=kind==='fish';raft.visible=kind==='raft'||kind==='depart';cue(460+index*25)}event(0);
$('#next').onclick=()=>event(index+1);$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Resume':'Pause'};$('#reset').onclick=()=>{camera.position.set(12,9,17);orbit.target.set(0,1,0)};$('#night').onclick=()=>{dark=!dark;scene.background.set(dark?'#0d2244':'#94cfdf');scene.fog.color.copy(scene.background);sun.intensity=dark?.5:3.1;sun.color.set(dark?'#a6bce8':'#fff1c9');seaMat.color.set(dark?'#153f67':'#207fa7');$('#night').textContent=dark?'Day':'Night'};
$('#sound').onclick=async()=>{if(ctx){if(ctx.state==='suspended')await ctx.resume();else await ctx.suspend();$('#sound').textContent=ctx.state==='running'?'Sound on':'Sound off';return}ctx=new AudioContext();master=ctx.createGain();master.gain.value=.2;master.connect(ctx.destination);const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),a=b.getChannelData(0);let previous=0;for(let i=0;i<a.length;i++){previous=previous*.985+(Math.random()*2-1)*.015;a[i]=previous}const src=ctx.createBufferSource();src.buffer=b;src.loop=true;noiseFilter=ctx.createBiquadFilter();noiseFilter.type='lowpass';noiseFilter.frequency.value=400;noiseGain=ctx.createGain();noiseGain.gain.value=.7;src.connect(noiseFilter).connect(noiseGain).connect(master);src.start();$('#sound').textContent='Sound on';cue()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('#pause').click()}else if(e.code==='ArrowRight')event(index+1)});
const clock=new T.Clock();let bird=0;function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(!paused){total+=dt;seconds+=dt;if(seconds>=duration)event(index+1)}const t=total,k=stories[index][2],phase=seconds/duration;
for(let i=0;i<seaPos.count;i++){let x=base[i*3],z=base[i*3+2];seaPos.array[i*3+1]=.08*Math.sin(x*.4+t*.7)+.09*Math.cos(z*.35-t*.6)}seaPos.needsUpdate=true;seaGeo.computeVertexNormals();foam.forEach((o,i)=>{o.material.opacity=.19+.09*Math.sin(t*.8+i);o.scale.x=1.32+.02*Math.sin(t*.6+i)});crown.rotation.z=.05*Math.sin(t);actor.position.set(0,.1+.025*Math.sin(t*2),.2);actor.rotation.set(0,.11*Math.sin(t*.3),0);torso.rotation.set(0,0,.025*Math.sin(t*1.2));head.rotation.set(0,0,.06*Math.sin(t*.7));arms.forEach((a,i)=>a.rotation.set(0,0,(i?1:-1)*(.08+.06*Math.sin(t*1.1)));legs.forEach(l=>l.rotation.x=0);
if(k==='fish'){actor.position.x=.9;actor.position.z=1;actor.rotation.y=-.5;arms[1].rotation.x=-.9;float.position.y=-.43+.05*Math.sin(t*2)}
if(k==='coconut'){arms[1].rotation.x=-1+Math.sin(t*2)*.7;coconut.position.y=.23+Math.max(0,Math.sin(t*2))*.16}
if(k==='run'){actor.position.x=1.55*Math.sin(t*1.5);actor.position.z=.7*Math.cos(t*1.5);actor.rotation.y=t*1.5;legs.forEach((l,i)=>l.rotation.x=Math.sin(t*10+i*Math.PI)*.55);actor.position.y=.12+Math.abs(Math.sin(t*10))*.1}
if(k==='wave'){arms[1].rotation.z=-2.4+.3*Math.sin(t*8);head.rotation.z=.14}
if(k==='build'||k==='raft'){torso.rotation.x=.25+.18*Math.sin(t*2);arms.forEach(a=>a.rotation.x=-.7+.3*Math.sin(t*3));if(k==='raft')actor.position.x=1.3}
if(k==='dance'){arms[0].rotation.z=-2.5;arms[1].rotation.z=2.5;legs.forEach((l,i)=>l.rotation.x=Math.sin(t*7+i*Math.PI)*.4);actor.position.y=.15+Math.abs(Math.sin(t*5))*.1}
if(k==='sleep'){actor.rotation.z=-1.4;actor.position.y=.22}
if(k==='depart'){actor.position.x=1.4;raft.position.x=1.6+.5*Math.sin(phase*Math.PI);raft.position.y=.05+.04*Math.sin(t*2)}
if(k==='alarm'){arms[0].rotation.z=-1.8;arms[1].rotation.z=1.8;head.rotation.z=.18*Math.sin(t*4)}
if(ctx&&ctx.state==='running'&&!paused){noiseFilter.frequency.value=(dark?180:350)+90*Math.sin(t*.5);noiseGain.gain.value=.65+.2*Math.sin(t*.4);if(!dark&&t-bird>9){bird=t;cue(1200)}}
$('#bar').style.width=(seconds/duration*100)+'%';orbit.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
