name: Validate Castaway story
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modules and test narrative director
        run: |
          node --check story-catalog.mjs
          node --check story-director.mjs
          node --check comedy-acting.mjs
          node --check crab-choreography.mjs
          node --test story-director.test.mjs comedy-acting.test.mjs crab-choreography.test.mjs camera-framing.test.mjs crab-geometry.test.mjs
      - name: Validate Vite runtime syntax
        run: |
          node --check src/main.js
          node --check src/camera-framing.js
          node --check src/crab-geometry.js
          node --check src/scene-runtime.js
          node --check src/scene-worker.js
          node --check src/audio/ocean-noise-processor.js
