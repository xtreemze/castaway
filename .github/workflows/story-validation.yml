name: Validate Castaway story
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modules and test narrative director
        run: |
          node --check story-catalog.mjs
          node --check story-director.mjs
          node --test story-director.test.mjs
      - name: Validate embedded browser module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          document = Path('index.html').read_text()
          matches = re.findall(r'<script\s+type="module"\s*>(.*?)</script>', document, re.S)
          assert len(matches) == 1, f'Expected one module script; found {len(matches)}'
          Path('/tmp/castaway-inline.mjs').write_text(matches[0])
          PY
          node --check /tmp/castaway-inline.mjs
