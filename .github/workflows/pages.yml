name: Build and deploy Castaway
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing choreography tests
        run: node --test ./*.test.mjs
      - name: Vite+ narrative tests
        run: npx vp test
      - name: Vite+ production build
        run: npx vp build
      - name: Browser render smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist &
          node browser-smoke.mjs
      - name: Retain desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castaway-visual-smoke
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
