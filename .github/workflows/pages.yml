name: Deploy Castaway Island
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html').read_text()
          scripts = re.findall(r'<script type="module">(.*?)</script>', page, re.S)
          if len(scripts) != 1:
              raise SystemExit('Expected exactly one browser module')
          Path('/tmp/castaway-check.mjs').write_text(scripts[0])
          PY
          node --check /tmp/castaway-check.mjs
          node --test animation-director.test.mjs scene-choreography.test.mjs prop-choreography.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
